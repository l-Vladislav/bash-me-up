# Visit counter and admin API for the site: npm run stats:deploy
# Secrets (not in this file): SALT and PASSWORD, set with
#   npx wrangler secret put <NAME> --config stats/wrangler.toml
name = "bash-me-up-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://l-vladislav.github.io"
ADMIN_URL = "https://l-vladislav.github.io/bash-me-up/admin/"

# Five sign-in attempts a minute per address.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "bash-me-up-stats"
database_id = "4f6b0114-ec91-45c7-ac87-6700204c706d"

# Deletes events older than a year.
[triggers]
crons = ["17 3 * * *"]
